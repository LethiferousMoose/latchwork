<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>__LATCHWORK_TITLE__ · Latchwork pattern</title>
<style>
  :root {
    --bg: #ECECEC; --panel: #FAFAFA; --ink: #1E1E1E; --muted: #666; --line: #C9C9C9;
    --accent: #1565C0; --warn: #9A6700; --row: #E53935;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.35 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr auto;
    grid-template-areas: "bar bar" "main legend" "rowbar legend"; overflow: hidden; }
  button { font: inherit; color: inherit; background: #fff; border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: #DCE8F7; border-color: #90B4E0; }
  button:active { background: #eee; }
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:active { background: #fff; }

  #bar { grid-area: bar; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #bar .title { font-weight: 700; font-size: 17px; }
  #bar .sub { color: var(--muted); font-size: 12.5px; }
  #bar .grow { flex: 1; }
  #bar .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  main { grid-area: main; position: relative; min-height: 0; min-width: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none;
    display: block; cursor: grab; }
  #toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    background: rgba(30,30,30,.88); color: #fff; padding: 6px 12px; border-radius: 8px;
    font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  #toast.show { opacity: 1; }

  #legend { grid-area: legend; width: 320px; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; }
  #legend header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); }
  #legend header .count { color: var(--muted); font-size: 13px; flex: 1; }
  #legend ul { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; }
  #legend li { display: flex; align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer;
    border-left: 4px solid transparent; }
  #legend li.sel { background: #DCE8F7; border-left-color: var(--accent); }
  #legend li.done .name { text-decoration: line-through; color: var(--muted); }
  #legend li.unassigned .name { color: var(--warn); }
  #legend canvas { width: 34px; height: 34px; border-radius: 4px; flex: none; }
  #legend .txt { flex: 1; min-width: 0; }
  #legend .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #legend .meta { color: var(--muted); font-size: 12.5px; }
  #legend label.done { display: flex; flex-direction: column; align-items: center; font-size: 11px;
    color: var(--muted); gap: 2px; padding: 4px; }
  #legend input[type=checkbox] { width: 22px; height: 22px; margin: 0; }

  #rowbar { grid-area: rowbar; display: flex; flex-direction: column; gap: 6px;
    padding: 8px; background: var(--panel); border-top: 1px solid var(--line); }
  #rowbar .line { display: flex; align-items: center; justify-content: center; gap: 10px; }
  /* the two tracker lines, with one tall Done button beside them (on the thumb side) */
  #tracks { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px;
    align-items: center; width: min(100%, 520px); margin: 0 auto; }   /* same width as the readout */
  #tracks .line { justify-content: space-between; }
  #tracks .label { flex: 1; min-width: 0; }
  #doneBtn { grid-column: 2; grid-row: 1 / span 2; align-self: stretch; min-width: 76px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0; padding: 4px 10px; line-height: 1.15; }
  #doneBtn .ic { font-size: 20px; }
  #doneBtn .what { font-size: 12px; color: var(--muted); }
  #doneBtn.undo .ic, #doneBtn.undo .txt { color: var(--muted); }
  #rowbar .label { min-width: 150px; text-align: center; }
  #rowbar .label b { font-size: 18px; }
  #rowbar button.big { min-width: 56px; font-size: 18px; padding: 6px 14px; }
  #rowbar button.toggle { min-width: 96px; }
  #rowbar .short { display: none; }
  #rowbar .dbl { letter-spacing: -.42em; margin-right: .42em; }   /* two triangles as one icon */
  /* both trackers on: what's in the tracked cell, and how many of it run to the right */
  /* both trackers on: the run jumps sit either side of the cell readout */
  /* fixed width, buttons pinned to the ends: only the text between them changes, so the
     buttons never move under your thumb as the yarn name changes */
  #readout { display: none; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center;
    gap: 10px; font-size: 15px; min-height: 34px; width: min(100%, 520px); margin: 0 auto; }
  #readout .cell { display: flex; align-items: center; justify-content: center; gap: 10px;
    min-width: 0; }
  #readout.on { display: grid; }
  #readout canvas { width: 30px; height: 30px; border-radius: 4px; flex: none;
    box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  #readout .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; }
  #readout .run { white-space: nowrap; color: var(--muted); }
  /* name · count on top, the brand small underneath: two lines in the height the swatch already takes */
  #readout .txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
  #readout .top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  #readout .brand { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #readout .brand:empty { display: none; }
  #readout .run b { color: var(--ink); font-size: 18px; }

  #printDlg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
    align-items: center; justify-content: center; z-index: 10; }
  #printDlg.open { display: flex; }
  #printDlg .box { background: #fff; border-radius: 12px; padding: 18px 20px; width: min(420px, 92vw); }
  #printDlg h2 { margin: 0 0 10px; font-size: 18px; }
  #printDlg label { display: block; margin: 8px 0; }
  #printDlg .est { color: var(--muted); font-size: 13px; margin: 10px 0 14px; }
  #printDlg .btns { display: flex; justify-content: flex-end; gap: 8px; }

  #printArea { display: none; }

  /* Phones: legend becomes a bottom sheet */
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-areas: "bar" "main" "rowbar"; }
    #legend { position: fixed; left: 0; right: 0; bottom: 0; width: auto; height: 55vh;
      border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
      box-shadow: 0 -6px 24px rgba(0,0,0,.18); transform: translateY(105%);
      transition: transform .22s ease; z-index: 5; }
    #legend.open { transform: none; }
    #bar { flex-wrap: nowrap; gap: 6px; padding: 8px 10px; }
    #bar > div:first-child { flex: 1; min-width: 0; }
    #bar .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #bar .sub, #bar .grow { display: none; }
    #bar .actions { flex: none; flex-wrap: nowrap; gap: 4px; }
    #bar button { padding: 6px 8px; font-size: 14px; }
    #legendInfo { display: block; }
    #rowbar .line { gap: 5px; }
    #rowbar .label { min-width: 0; flex: 1; white-space: nowrap; }
    #rowbar button { padding: 6px 9px; }
    #rowbar button.big { min-width: 42px; padding: 6px 8px; }
    #rowbar button.toggle { min-width: 80px; }
    #tracks { gap: 6px 5px; width: 100%; }
    #doneBtn { min-width: 62px; padding: 4px 6px; }
    #rowbar .long { display: none; }
    #rowbar .short { display: inline; }
    #readout { gap: 5px; width: 100%; }
    #readout .cell { gap: 8px; }
  }
  @media (min-width: 821px) { #legendBtn { display: none; } #closeLegend { display: none; } }
  #legendInfo { display: none; padding: 8px 12px; color: var(--muted); font-size: 12.5px;
    border-bottom: 1px solid var(--line); }

  @page { size: letter portrait; margin: 0.35in; }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; display: block; }
    #bar, main, #legend, #rowbar, #printDlg { display: none !important; }
    #printArea { display: block; }
    .page { page-break-after: always; break-after: page; }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .page h3 { margin: 0 0 4px; font-size: 13pt; }
    .page .pmeta { margin: 0 0 6px; font-size: 9pt; color: #444; }
    .page img { display: block; max-width: 100%; }
    .page table { border-collapse: collapse; font-size: 9.5pt; margin-top: 8px; }
    .page td, .page th { border: 1px solid #bbb; padding: 3px 6px; text-align: left; }
    .page td.n { text-align: right; }
  }
</style>
</head>
<body>
<div id="bar">
  <div>
    <div class="title" id="title"></div>
  </div>
  <div class="sub" id="sub"></div>
  <div class="grow"></div>
  <div class="actions">
    <button id="fitBtn" title="Show the whole pattern">Fit</button>
    <button id="symBtn" aria-pressed="true" title="Symbols: Auto (when big enough) / Always / Off">Symbols: Auto</button>
    <button id="legendBtn">Yarns</button>
    <button id="printBtn">Print…</button>
  </div>
</div>

<main>
  <canvas id="view"></canvas>
  <div id="toast"></div>
</main>

<aside id="legend">
  <header>
    <span class="count" id="legendCount"></span>
    <button id="showAll" disabled title="Click a yarn to show only that yarn; this shows them all again">Show all</button>
    <button id="closeLegend" aria-label="Close">✕</button>
  </header>
  <div id="legendInfo"></div>
  <ul id="legendList"></ul>
</aside>

<div id="rowbar">
  <div id="readout">
    <button id="runBack" class="big" aria-label="Start of this or the previous color run" title="Previous color run"><span class="dbl">◀︎◀︎</span></button>
    <div class="cell"><canvas id="readSw" width="60" height="60"></canvas>
      <div class="txt"><div class="top"><span class="name" id="readName"></span><span class="run" id="readRun"></span></div>
        <div class="brand" id="readBrand"></div></div></div>
    <button id="runNext" class="big" aria-label="Next color run" title="Next color run"><span class="dbl">▶︎▶︎</span></button>
  </div>
  <div id="tracks">
  <div class="line">
    <button id="rowTrack" class="toggle" aria-pressed="false" title="Highlight one row at a time">Row</button>
    <button id="rowDown" class="big" aria-label="Row down">▼</button>
    <span class="label" id="rowLabel"></span>
    <button id="rowUp" class="big" aria-label="Row up">▲</button>
  </div>
  <div class="line">
    <button id="colTrack" class="toggle" aria-pressed="false" title="Highlight one column at a time; with the row tracker, read one cell">Column</button>
    <button id="colLeft" class="big" aria-label="Column left">◀︎</button>
    <span class="label" id="colLabel"></span>
    <button id="colRight" class="big" aria-label="Column right">▶︎</button>
  </div>
  <button id="doneBtn" title="Mark what's tracked as hooked, then move on (Enter)"><span class="ic" id="doneIc">✓</span><span class="txt" id="doneTxt">Done</span><span class="what" id="doneWhat"></span></button>
  </div>
</div>

<div id="printDlg" role="dialog" aria-modal="true">
  <div class="box">
    <h2>Print pattern</h2>
    <label><input type="checkbox" id="pOverview" checked> Overview page and yarn legend</label>
    <label><input type="checkbox" id="pFull"> Full-color pattern pages (all yarns)</label>
    <label><input type="checkbox" id="pPerColor" checked> One set of pages per yarn
      <br><small>Only the pages where that yarn appears</small></label>
    <div class="est" id="pEst"></div>
    <div class="btns"><button id="pCancel">Cancel</button><button id="pGo">Print</button></div>
  </div>
</div>

<div id="printArea"></div>

<script id="latchwork-data" type="application/json">/*__LATCHWORK_DATA__*/null</script>
<script>
"use strict";
window.onerror = function (msg) { document.documentElement.setAttribute("data-error", msg); };

const D = JSON.parse(document.getElementById("latchwork-data").textContent);
const W = D.width, H = D.height, Y = D.yarns, NONE = 0xFFFF;
const cells = (() => {
  const bin = atob(D.cells), out = new Uint16Array(W * H);
  for (let i = 0; i < out.length; i++) out[i] = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
  return out;
})();
const PALE = "#E6E6E6", EMPTY = "#FFFFFF";
const SYM_MIN = 7;   // smallest cell (CSS px) that gets a symbol in Auto mode
const SYM_FLOOR = 3; // Always mode: below this a symbol can't be drawn at all
const SYM_MODES = ["auto", "always", "off"];
const fmt = n => n.toLocaleString("en-US");

// ---------- saved state (per pattern, on this device) ----------
const STORE = "latchwork:" + D.key;
// done: yarns ticked by hand; knotted: hooked cells, a bitset (cell index = row from the top * W + col)
const state = { done: [], knotted: "", rowOn: false, row: 1, colOn: false, col: 1, sym: "auto" };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (e) {}
// older patterns saved sym as true/false
if (state.sym === true) state.sym = "auto";
if (!SYM_MODES.includes(state.sym)) state.sym = "off";
const doneBits = new Uint8Array(Math.ceil(W * H / 8));
try {
  const b = atob(state.knotted || "");
  if (b.length === doneBits.length) for (let i = 0; i < b.length; i++) doneBits[i] = b.charCodeAt(i);
} catch (e) {}
const isDone = i => (doneBits[i >> 3] >> (i & 7)) & 1;
function setDone(i, on) {
  if (on) doneBits[i >> 3] |= 1 << (i & 7); else doneBits[i >> 3] &= ~(1 << (i & 7));
}
function save() {
  let b = "";
  for (let i = 0; i < doneBits.length; i++) b += String.fromCharCode(doneBits[i]);
  state.knotted = doneBits.some(v => v) ? btoa(b) : "";
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
}
let sel = -1;   // highlighted yarn index, -1 = all

// ---------- symbols: drawn shapes (consistent everywhere), then letters/numbers ----------
const SHAPES = 20;
function poly(ctx, cx, cy, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * 2 * Math.PI / n;
    ctx[i ? "lineTo" : "moveTo"](cx + r * Math.cos(a), cy + r * Math.sin(a));
  }
  ctx.closePath();
}
function star(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;
    ctx[i ? "lineTo" : "moveTo"](cx + rr * Math.cos(a), cy + rr * Math.sin(a));
  }
  ctx.closePath();
}
function drawSymbol(ctx, idx, cx, cy, size, ink) {
  const r = size * 0.36, lw = Math.max(1, size * 0.11);
  ctx.save();
  ctx.fillStyle = ctx.strokeStyle = ink; ctx.lineWidth = lw; ctx.lineJoin = "round"; ctx.lineCap = "round";
  if (Y[idx] && Y[idx].unassigned) { text("?"); ctx.restore(); return; }
  const k = idx % SHAPES, fill = () => ctx.fill(), line = () => ctx.stroke();
  function text(t) {
    ctx.font = "700 " + Math.round(size * (t.length > 1 ? 0.5 : 0.68)) + "px Segoe UI, Arial, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(t, cx, cy + size * 0.04);
  }
  if (idx >= SHAPES) {
    const j = idx - SHAPES;
    text(j < 26 ? String.fromCharCode(65 + j) : String(j - 25));
    ctx.restore(); return;
  }
  switch (k) {
    case 0: ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); fill(); break;
    case 1: ctx.fillRect(cx - r * .85, cy - r * .85, r * 1.7, r * 1.7); break;
    case 2: poly(ctx, cx, cy + r * .15, r * 1.1, 3, -Math.PI / 2); fill(); break;
    case 3: poly(ctx, cx, cy, r * 1.1, 4, 0); fill(); break;
    case 4: ctx.lineWidth = lw * 1.6; ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
            ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); line(); break;
    case 5: ctx.lineWidth = lw * 1.6; ctx.beginPath(); ctx.moveTo(cx - r * .8, cy - r * .8); ctx.lineTo(cx + r * .8, cy + r * .8);
            ctx.moveTo(cx + r * .8, cy - r * .8); ctx.lineTo(cx - r * .8, cy + r * .8); line(); break;
    case 6: ctx.beginPath(); ctx.arc(cx, cy, r * .9, 0, 7); line(); break;
    case 7: ctx.strokeRect(cx - r * .8, cy - r * .8, r * 1.6, r * 1.6); break;
    case 8: poly(ctx, cx, cy + r * .15, r * 1.05, 3, -Math.PI / 2); line(); break;
    case 9: poly(ctx, cx, cy, r * 1.05, 4, 0); line(); break;
    case 10: poly(ctx, cx, cy - r * .15, r * 1.1, 3, Math.PI / 2); fill(); break;
    case 11: star(ctx, cx, cy, r * 1.15); fill(); break;
    case 12: star(ctx, cx, cy, r * 1.1); line(); break;
    case 13: poly(ctx, cx, cy, r, 6, 0); fill(); break;
    case 14: poly(ctx, cx, cy, r, 6, 0); line(); break;
    case 15: ctx.beginPath(); ctx.arc(cx, cy, r * .9, 0, 7); line();
             ctx.beginPath(); ctx.arc(cx, cy, r * .35, 0, 7); fill(); break;
    case 16: ctx.fillRect(cx - r, cy - r * .3, r * 2, r * .6); break;
    case 17: ctx.fillRect(cx - r * .3, cy - r, r * .6, r * 2); break;
    case 18: poly(ctx, cx, cy, r * 1.05, 4, 0); line();
             ctx.beginPath(); ctx.arc(cx, cy, r * .3, 0, 7); fill(); break;
    case 19: ctx.fillRect(cx - r * .85, cy - r * .85, r * 1.7, r * 1.7);
             ctx.clearRect(cx - r * .35, cy - r * .35, r * .7, r * .7);
             ctx.fillStyle = Y[idx].hex; ctx.fillRect(cx - r * .35, cy - r * .35, r * .7, r * .7); break;
  }
  ctx.restore();
}

// ---------- the pattern bitmap (1 pixel per knot), rebuilt when the highlight changes ----------
function hexRGB(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
const RGB = Y.map(y => hexRGB(y.hex)), PALE_RGB = hexRGB(PALE), EMPTY_RGB = hexRGB(EMPTY);
function buildBitmap(highlight, x0 = 0, y0 = 0, w = W, h = H) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"), img = g.createImageData(w, h), px = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = cells[(y0 + y) * W + x0 + x];
    const rgb = v === NONE ? EMPTY_RGB : (highlight >= 0 && v !== highlight ? PALE_RGB : RGB[v]);
    const o = (y * w + x) * 4;
    px[o] = rgb[0]; px[o + 1] = rgb[1]; px[o + 2] = rgb[2]; px[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}
let bitmap = buildBitmap(-1);
// hooked cells: a white veil (1 pixel per cell), drawn over the pattern on screen only
let doneLayer = null;
function buildDoneLayer() {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), img = g.createImageData(W, H), px = img.data;
  let any = false;
  for (let i = 0; i < W * H; i++) if (isDone(i)) {
    px[4 * i] = px[4 * i + 1] = px[4 * i + 2] = 255; px[4 * i + 3] = 175; any = true;
  }
  g.putImageData(img, 0, 0);
  doneLayer = any ? c : null;
}
buildDoneLayer();

// ---------- grid drawing shared by screen and print ----------
// opts: {x0, y0, w, h (cell window), s (px per cell), ox, oy (where cell x0,y0 lands), highlight,
//        sym, bmp (bitmap of that window), clip: [vw, vh] or null, done: hooked-cell veil or null
//        (screen only: whole pattern, hooked cells get no symbol)}
function drawGrid(ctx, o) {
  const { s, ox, oy } = o;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(o.bmp, ox, oy, o.w * s, o.h * s);
  if (o.done) ctx.drawImage(o.done, ox, oy, o.w * s, o.h * s);
  const vw = o.clip ? o.clip[0] : ox + o.w * s, vh = o.clip ? o.clip[1] : oy + o.h * s;
  const c0 = Math.max(0, Math.floor(-ox / s)), c1 = Math.min(o.w, Math.ceil((vw - ox) / s));
  const r0 = Math.max(0, Math.floor(-oy / s)), r1 = Math.min(o.h, Math.ceil((vh - oy) / s));
  if (c1 <= c0 || r1 <= r0) return;
  // symbols
  // o.sym: "auto"/true = only when cells are big enough, "always" = down to SYM_FLOOR
  const symMin = o.sym === "always" ? SYM_FLOOR : SYM_MIN;
  // The widest symbols (outlined star, hexagon) reach 0.47 of their size from the centre. Keep
  // 1.5 px clear of the cell edge (the bold 10-line is 2 px, centred on the edge), but never
  // shrink a symbol below 72% of the cell, where it would stop being readable.
  const symSize = Math.min(s, Math.max(s * 0.72, (s / 2 - 1.5) / 0.47));
  if (o.sym && o.sym !== "off" && s >= symMin) {
    for (let r = r0; r < r1; r++) for (let c = c0; c < c1; c++) {
      const i = (o.y0 + r) * W + o.x0 + c, v = cells[i];
      if (v === NONE || (o.highlight >= 0 && v !== o.highlight) || (o.done && isDone(i))) continue;
      drawSymbol(ctx, v, ox + (c + .5) * s, oy + (r + .5) * s, symSize, Y[v].ink);
    }
  }
  // grid lines: thin per cell when large enough, bold every 10 (rows counted from the bottom)
  const line = (x1, y1, x2, y2) => { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); };

const view = document.getElementById("view"), vctx = view.getContext("2d");

document.getElementById("printBtn").onclick = () => { updateEstimate(); dlg.classList.add("open"); };
function closePrint() { dlg.classList.remove("open"); }
document.getElementById("pCancel").onclick = closePrint;

function renderTile(t, hl) {
  const k = 2, s = P_CELL;
  const c = document.createElement("canvas");
  c.width = (P_GL + t.w * s + 2) * k; c.height = (P_GT + t.h * s + 2) * k;
  const g = c.getContext("2d"); g.scale(k, k);
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  drawGrid(g, { x0: t.x0, y0: t.y0, w: t.w, h: t.h, s, ox: P_GL, oy: P_GT, highlight: hl, sym: true,
                bmp: buildBitmap(hl, t.x0, t.y0, t.w, t.h), clip: null });
  g.fillStyle = "#333"; g.font = "9px Arial, sans-serif"; g.textBaseline = "middle";
  g.textAlign = "center";
  for (let c2 = 0; c2 < t.w; c2++) { const n = t.x0 + c2 + 1; if (n % 5 === 0 || c2 === 0) g.fillText(String(n), P_GL + (c2 + .5) * s, P_GT / 2); }
  g.textAlign = "right";
  for (let r = 0; r < t.h; r++) { const n = H - (t.y0 + r); if (n % 5 === 0 || r === t.h - 1) g.fillText(String(n), P_GL - 4, P_GT + (r + .5) * s); }
  return c.toDataURL("image/png");
}
function renderOverview() {
  const maxW = 700, maxH = 560, s = Math.max(0.5, Math.min(maxW / W, maxH / H)), k = 2;
  const c = document.createElement("canvas");
  c.width = Math.ceil((W * s + 2) * k); c.height = Math.ceil((H * s + 2) * k);
  const g = c.getContext("2d"); g.scale(k, k);
  drawGrid(g, { x0: 0, y0: 0, w: W, h: H, s, ox: 1, oy: 1, highlight: -1, sym: s >= SYM_MIN,
                bmp: buildBitmap(-1), clip: null });
  // tile borders and labels so pages can be found on the overview
  g.strokeStyle = "rgba(21,101,192,.9)"; g.lineWidth = 1.5; g.font = "bold 11px Arial"; g.fillStyle = "rgba(21,101,192,.95)";
  g.textAlign = "left"; g.textBaseline = "top";
  tiles().forEach(t => { g.strokeRect(1 + t.x0 * s, 1 + t.y0 * s, t.w * s, t.h * s); g.fillText(t.label, 4 + t.x0 * s, 4 + t.y0 * s); });
  return c.toDataURL("image/png");
}
function el(tag, props, ...kids) { const e = document.createElement(tag); Object.assign(e, props || {}); e.append(...kids); return e; }
async function doPrint() {
  const pages = pagesFor(printOpts()), area = document.getElementById("printArea");
  area.innerHTML = "";
  const btn = document.getElementById("pGo"); btn.disabled = true; btn.textContent = "Preparing…";
  await new Promise(r => setTimeout(r, 30));
  const imgs = [];
  for (const p of pages) {
    const page = el("div", { className: "page" });
    if (p.kind === "overview") {
      page.append(el("h3", { textContent: D.name + " · overview" }),
                  el("p", { className: "pmeta", textContent: W + " × " + H + " holes · " + fmt(D.knots) +
                    " knots · finished " + D.finished + " · canvas to cut " + D.canvas }));
      const im = el("img", { src: renderOverview() }); im.style.width = "100%"; imgs.push(im); page.append(im);
      const tb = el("table");
      tb.append(el("tr", {}, el("th", { textContent: "" }), el("th", { textContent: "Yarn" }),
                    el("th", { textContent: "Knots" }), el("th", { textContent: "Need" })));
      Y.forEach((y, i) => {
        const ic = legendIcon(i); ic.style.width = ic.style.height = "18px";
        const im2 = el("img", { src: ic.toDataURL() }); im2.style.width = im2.style.height = "18px"; imgs.push(im2);
        tb.append(el("tr", {}, el("td", {}, im2), el("td", { textContent: y.name }),
                      el("td", { className: "n", textContent: fmt(y.count) }), el("td", { textContent: y.need })));
      });
      page.append(tb);
    } else {
      const t = p.t, who = p.hl >= 0 ? Y[p.hl].name : "All yarns";
      page.append(el("h3", { textContent: D.name + " · " + who + " · page " + t.label }),
                  el("p", { className: "pmeta", textContent: "Columns " + (t.x0 + 1) + "–" + (t.x0 + t.w) +
                    " · rows " + (H - t.y0 - t.h + 1) + "–" + (H - t.y0) + " (row 1 = bottom)" +
                    (p.hl >= 0 ? " · " + fmt(Y[p.hl].count) + " knots of this yarn in total" : "") }));
      const im = el("img", { src: renderTile(t, p.hl) });
      im.style.width = ((P_GL + t.w * P_CELL + 2) / 96) + "in"; imgs.push(im); page.append(im);
    }
    area.append(page);
  }
  await Promise.all(imgs.map(i => i.decode ? i.decode().catch(() => {}) : 0));
  btn.disabled = false; btn.textContent = "Print"; closePrint();
  window.print();
}
document.getElementById("pGo").onclick = doPrint;
window.addEventListener("afterprint", () => { document.getElementById("printArea").innerHTML = ""; });

// ---------- start ----------
syncSym(); syncTrack(); refreshProgress(); buildLegend();
window.addEventListener("resize", () => { resize(); });
resize(); fit();
document.documentElement.setAttribute("data-ready", "1");
</script>
